{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Staff</title>

    <link rel="stylesheet" href="{% static 'staff/css/style.css' %}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

</head>
<body>

<div class="delete-container">

    <div class="delete-card">

        <div class="warning-icon">

            <i class="fa-solid fa-triangle-exclamation"></i>

        </div>

        <h2>Delete Staff Member</h2>

        <p class="msg">

            Are you sure you want to delete this staff member?

        </p>

        <div class="staff-details">

            <p><strong>Name :</strong> {{ staff.full_name }}</p>

            <p><strong>Employee ID :</strong> {{ staff.employee_id }}</p>

            <p><strong>Department :</strong> {{ staff.department }}</p>

            <p><strong>Service :</strong> {{ staff.service }}</p>

            <p><strong>Status :</strong> {{ staff.status }}</p>

        </div>

        <form method="POST">

            {% csrf_token %}

            <div class="button-group">

                <button type="submit" class="delete-btn-big">

                    <i class="fa-solid fa-trash"></i>

                    Delete Staff

                </button>

                <a href="{% url 'staff_list' %}" class="cancel-btn">

                    <i class="fa-solid fa-arrow-left"></i>

                    Cancel

                </a>

            </div>

        </form>

    </div>

</div>

</body>
</html>
