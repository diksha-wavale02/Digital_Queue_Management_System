<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>User Dashboard</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background: #eef4ff;
            font-family: Arial, Helvetica, sans-serif;
            color: #333;
        }

        .navbar {
            background: #2864df;
            color: white;
            padding: 20px 40px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h2 {
            margin: 0;
            font-size: 25px;
        }

        .logout-btn {
            background: white;
            color: #2864df;
            text-decoration: none;

            padding: 10px 18px;
            border-radius: 8px;

            font-weight: bold;
        }

        .container {
            width: 92%;
            margin: 40px auto;
        }

        .welcome-card {
            background: white;
            padding: 35px;

            border-radius: 20px;

            box-shadow: 0 8px 25px rgba(50, 90, 150, 0.10);

            margin-bottom: 30px;
        }

        .welcome-card h1 {
            margin: 0 0 10px;

            color: #2864df;
            font-size: 38px;
        }

        .welcome-card p {
            margin: 0;

            color: #666;
            font-size: 18px;
        }

        .section {
            background: white;
            padding: 30px;

            border-radius: 20px;

            box-shadow: 0 8px 25px rgba(50, 90, 150, 0.10);
        }

        .section h2 {
            margin-top: 0;
            color: #2864df;
        }

        .menu {
            display: grid;
            grid-template-columns: repeat(3, 1fr);

            gap: 20px;
        }

        .menu-card {
            background: #eef4ff;

            padding: 25px;

            border-radius: 14px;

            text-decoration: none;
            color: #2864df;

            font-size: 18px;
            font-weight: bold;

            transition: 0.2s;
        }

        .menu-card:hover {
            background: #dce8ff;
            transform: translateY(-2px);
        }

        @media (max-width: 800px) {
            .menu {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="navbar">

        <h2>Digital Queue Management System</h2>

        <a href="{% url 'logout' %}" class="logout-btn">
            Logout
        </a>

    </div>


    <div class="container">

        <div class="welcome-card">

            <h1>User Dashboard</h1>

            <p>
                Welcome! Manage your queue and track your token easily.
            </p>

        </div>


        <div class="section">

            <h2>Quick Actions</h2>

            <div class="menu">

                <a href="/queue/" class="menu-card">
                    🎫 Get Token
                </a>

                <a href="/dashboard/queue/" class="menu-card">
                    📋 Queue Status
                </a>

                <a href="/dashboard/history/" class="menu-card">
                    🕐 Token History
                </a>

                <a href="/dashboard/notifications/" class="menu-card">
                    🔔 Notifications
                </a>

                <a href="/services/" class="menu-card">
                    ⚙ Services
                </a>

                <a href="/appointments/" class="menu-card">
                    📅 Appointments
                </a>

            </div>

        </div>

    </div>

</body>

</html>
