<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Staff Dashboard</title>

    <style>

        body {
            margin: 0;
            padding: 0;

            background: #eef4ff;

            font-family: Arial, Helvetica, sans-serif;

            color: #333;
        }


        /* NAVBAR */

        .navbar {

            background: #2864df;

            color: white;

            padding: 20px 40px;

            display: flex;

            justify-content: space-between;

            align-items: center;
        }


        .navbar h2 {

            margin: 0;

            font-size: 25px;
        }


        .logout-btn {

            background: white;

            color: #2864df;

            text-decoration: none;

            padding: 10px 18px;

            border-radius: 8px;

            font-weight: bold;
        }


        /* CONTAINER */

        .container {

            width: 92%;

            margin: 40px auto;
        }


        /* HEADER */

        .header-card {

            background: white;

            padding: 35px;

            border-radius: 20px;

            box-shadow:
                0 8px 25px rgba(50, 90, 150, 0.10);

            margin-bottom: 30px;
        }


        .header-card h1 {

            margin: 0 0 10px;

            color: #2864df;

            font-size: 38px;
        }


        .header-card p {

            margin: 0;

            color: #666;

            font-size: 18px;
        }


        /* STAT CARDS */

        .stats {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 25px;

            margin-bottom: 30px;
        }


        .stat-card {

            background: white;

            padding: 28px;

            border-radius: 18px;

            border-left:
                6px solid #2864df;

            box-shadow:
                0 8px 25px rgba(50, 90, 150, 0.10);
        }


        .stat-card h3 {

            margin: 0 0 15px;

            color: #555;

            font-size: 18px;
        }


        .number {

            color: #2864df;

            font-size: 38px;

            font-weight: bold;
        }


        /* MANAGEMENT */

        .section {

            background: white;

            padding: 30px;

            border-radius: 20px;

            box-shadow:
                0 8px 25px rgba(50, 90, 150, 0.10);
        }


        .section h2 {

            margin-top: 0;

            color: #2864df;
        }


        .actions {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 20px;
        }


        .action {

            background: #eef4ff;

            padding: 25px;

            border-radius: 14px;

            text-decoration: none;

            color: #2864df;

            font-size: 18px;

            font-weight: bold;

            transition: 0.2s;
        }


        .action:hover {

            background: #dce8ff;

            transform:
                translateY(-2px);
        }


        @media (max-width: 800px) {

            .stats {

                grid-template-columns: 1fr;
            }

            .actions {

                grid-template-columns: 1fr;
            }
        }

    </style>

</head>


<body>


    <!-- NAVBAR -->

    <div class="navbar">

        <h2>
            Digital Queue Management System
        </h2>

        <a
            href="{% url 'logout' %}"
            class="logout-btn">

            Logout

        </a>

    </div>


    <!-- MAIN -->

    <div class="container">


        <!-- HEADER -->

        <div class="header-card">

            <h1>
                Staff Dashboard
            </h1>

            <p>
                Manage queue tokens and assist customers.
            </p>

        </div>


        <!-- STATISTICS -->

        <div class="stats">


            <div class="stat-card">

                <h3>
                    Waiting Tokens
                </h3>

                <div class="number">
                    18
                </div>

            </div>


            <div class="stat-card">

                <h3>
                    Tokens Served
                </h3>

                <div class="number">
                    40
                </div>

            </div>


            <div class="stat-card">

                <h3>
                    Current Token
                </h3>

                <div class="number">
                    A102
                </div>

            </div>


        </div>


        <!-- ACTIONS -->

        <div class="section">

            <h2>
                Queue Management
            </h2>


            <div class="actions">


                <a
                    href="/queue/"
                    class="action">

                    🎫 View Queue

                </a>


                <a
                    href="/dashboard/queue/"
                    class="action">

                    📋 Queue Status

                </a>


                <a
                    href="/dashboard/token/"
                    class="action">

                    🔄 Current Token

                </a>


                <a
                    href="/dashboard/history/"
                    class="action">

                    🕐 Token History

                </a>


                <a
                    href="/dashboard/notifications/"
                    class="action">

                    🔔 Notifications

                </a>


                <a
                    href="/services/"
                    class="action">

                    ⚙ Services

                </a>


            </div>

        </div>

    </div>


</body>

</html>
