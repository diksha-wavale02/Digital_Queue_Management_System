{% load static %}

<!DOCTYPE html>
<html>

<head>

    <title>Login - DQMS</title>

    <link rel="stylesheet"
          href="{% static 'users/login.css' %}">

</head>

<body>

<div class="login-page">

    <div class="login-card">

        <div class="logo">
            DQ
        </div>

        <h1>Welcome Back</h1>

        <p>
            Digital Queue Management System
        </p>

        {% if messages %}

            {% for message in messages %}

                <div class="error">
                    {{ message }}
                </div>

            {% endfor %}

        {% endif %}


        <form method="POST">

            {% csrf_token %}

            <div class="form-group">

                <label>Username</label>

                <input
                    type="text"
                    name="username"
                    placeholder="Enter username"
                    required
                >

            </div>


            <div class="form-group">

                <label>Password</label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter password"
                    required
                >

            </div>


            <button type="submit">
                Login
            </button>

        </form>

    </div>

</div>

</body>

</html>
