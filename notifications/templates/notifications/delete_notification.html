<!DOCTYPE html>
<html>
<head>
    <title>Delete Notification</title>
</head>
<body>

<h2>Delete Notification</h2>

<p>Are you sure you want to delete this notification?</p>

<h3>{{ notification.title }}</h3>

<form method="POST">
    {% csrf_token %}

    <button type="submit">
        Yes, Delete
    </button>

    <a href="{% url 'notification_list' %}">
        Cancel
    </a>

</form>

</body>
</html>
