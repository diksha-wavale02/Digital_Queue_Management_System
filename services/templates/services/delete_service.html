{% load static %}

<!DOCTYPE html>

<html>

<head>

<title>Delete Service</title>

<link rel="stylesheet"
href="{% static 'services/css/style.css' %}">

</head>

<body>

<div class="delete-box">

<h2>

Delete Service

</h2>

<p>

Are you sure you want to delete

<b>

{{ service.service_name }}

</b>

?

</p>

<form method="POST">

{% csrf_token %}

<button class="delete-btn">

Delete

</button>

<a href="{% url 'service_list' %}">

Cancel

</a>

</form>

</div>

</body>

</html>
