<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Queue Status</title>
</head>
<body>
    <h2>Update Queue Status</h2>
    <p><strong>Token:</strong> {{ queue.token_number }}</p>
    <p><strong>Customer:</strong> {{ queue.appointment.customer_name }}</p>
    <form method="POST">
    {% csrf_token %}

    <label>Status</label><br><br>

    <select name="status">
        <option value="Waiting"
        {% if queue.status == "Waiting" %}selected{% endif %}>
        Waiting
        </option>

        <option value="In Progress"
        {% if queue.status == "In Progress" %}selected{% endif %}>
        In Progress
        </option>
        <option value="Completed"
        {% if queue.status == "Completed" %}selected{% endif %}>
        Completed
        </option>
    </select>    
    <br><br>

    <button type="submit">Update Status</button>

</form>

<br>
<a href="{% url 'view_queue' %}">Back to Queue</a>

</body>
</html>
