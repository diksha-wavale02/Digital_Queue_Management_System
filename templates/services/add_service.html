<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add New Service</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body>

<div class="container mt-5">

    <div class="card shadow p-4">

        <h2 class="mb-4">
            Add New Service
        </h2>

        <form method="POST">

            {% csrf_token %}

            <!-- CATEGORY -->

            <div class="mb-3">

                <label class="form-label">
                    Category
                </label>

                <select
                    name="category"
                    class="form-select"
                    required
                >

                    <option value="">
                        -- Select Category --
                    </option>

                    {% for category in categories %}

                        <option value="{{ category.id }}">
                            {{ category.name }}
                        </option>

                    {% endfor %}

                </select>

            </div>


            <!-- SERVICE NAME -->

            <div class="mb-3">

                <label class="form-label">
                    Service Name
                </label>

                <input
                    type="text"
                    name="name"
                    class="form-control"
                    placeholder="Enter service name"
                    required
                >

            </div>


            <!-- DURATION -->

            <div class="mb-3">

                <label class="form-label">
                    Duration (minutes)
                </label>

                <input
                    type="number"
                    name="duration"
                    class="form-control"
                    value="15"
                    min="1"
                    required
                >

            </div>


            <!-- ADD BUTTON -->

            <button
                type="submit"
                class="btn btn-primary"
            >
                Add Service
            </button>

            <a
                href="{% url 'view_service' %}"
                class="btn btn-secondary"
            >
                View Services
            </a>

        </form>

    </div>

</div>

</body>
</html>
