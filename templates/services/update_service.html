```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Update Service</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body>

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-7">

            <div class="card shadow">

                <div class="card-header bg-dark text-white">

                    <h2 class="mb-0">
                        Update Service
                    </h2>

                </div>


                <div class="card-body p-4">

                    <form method="POST">

                        {% csrf_token %}


                        <!-- CATEGORY -->

                        <div class="mb-3">

                            <label
                                for="category"
                                class="form-label fw-semibold"
                            >
                                Category
                            </label>

                            <select
                                name="category"
                                id="category"
                                class="form-select"
                                required
                            >

                                {% for category in categories %}

                                    <option
                                        value="{{ category.id }}"
                                        {% if category.id == service.category.id %}
                                            selected
                                        {% endif %}
                                    >
                                        {{ category.name }}
                                    </option>

                                {% endfor %}

                            </select>

                        </div>


                        <!-- SERVICE NAME -->

                        <div class="mb-3">

                            <label
                                for="name"
                                class="form-label fw-semibold"
                            >
                                Service Name
                            </label>

                            <input
                                type="text"
                                name="name"
                                id="name"
                                class="form-control"
                                value="{{ service.name }}"
                                required
                            >

                        </div>


                        <!-- DURATION -->

                        <div class="mb-4">

                            <label
                                for="duration"
                                class="form-label fw-semibold"
                            >
                                Duration (minutes)
                            </label>

                            <input
                                type="number"
                                name="duration"
                                id="duration"
                                class="form-control"
                                value="{{ service.duration }}"
                                min="1"
                                required
                            >

                        </div>


                        <!-- BUTTONS -->

                        <div class="d-flex gap-2">

                            <button
                                type="submit"
                                class="btn btn-primary"
                            >
                                Update Service
                            </button>

                            <a
                                href="{% url 'view_service' %}"
                                class="btn btn-secondary"
                            >
                                Back to Services
                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
```
