<!DOCTYPE html>
<html lang="en">

<head>

<title>Change Password</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
background:#f4f7fc;
}

.card{
margin-top:80px;
border-radius:15px;
}

</style>

</head>

<body>

<div class="container">

<div class="row justify-content-center">

<div class="col-md-5">

<div class="card shadow">

<h3>Change Password</h3>

</div>

<div class="card-body">

<form method="POST">

{% csrf_token %}

{{ form.as_p }}

<button class="btn btn-success w-100">

Update Password

</button>

</form>

</div>

</div>

</div>

</div>

</div>

</body>

</html>
