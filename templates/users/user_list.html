{% load static %}

<!DOCTYPE html>
<html>
<head>

    <title>Users</title>

    <link rel="stylesheet"
          href="{% static 'users/css/users.css' %}">

</head>

<body>

<div class="users-container">

    <div class="users-header">

        <div>
            <h2>User Management</h2>
            <p>Manage registered users</p>
        </div>

        <a href="{% url 'register' %}" class="add-btn">
            + Add User
        </a>

    </div>

    <div class="users-table">

        <table>

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Full Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Created At</th>
                </tr>
            </thead>

            <tbody>

                {% for user in users %}

                <tr>
                    <td>{{ user.id }}</td>
                    <td>{{ user.full_name }}</td>
                    <td>{{ user.email }}</td>
                    <td>{{ user.phone }}</td>
                    <td>{{ user.created_at|date:"d M Y" }}</td>
                </tr>

                {% empty %}

                <tr>
                    <td colspan="5">
                        No users registered.
                    </td>
                </tr>

                {% endfor %}

            </tbody>

        </table>

    </div>

</div>

</body>
</html>
